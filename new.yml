---
- name: Install Notepad++ on Windows EC2
  hosts: windows
  gather_facts: true

  collections:
    - chocolatey.chocolatey
    - ansible.windows

  tasks:

    - name: Verify Windows connectivity
      ansible.windows.win_ping:

    - name: Display target Windows host
      ansible.builtin.debug:
        msg: "Installing Notepad++ on {{ inventory_hostname }}"

    - name: Ensure Chocolatey is installed
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present

    - name: Install Notepad++
      chocolatey.chocolatey.win_chocolatey:
        name: notepadplusplus
        state: present

    - name: Verify Notepad++ installation
      ansible.windows.win_powershell:
        script: |
          $paths = @(
            "C:\Program Files\Notepad++\notepad++.exe",
            "C:\Program Files (x86)\Notepad++\notepad++.exe"
          )

          $installed = $paths | Where-Object {
            Test-Path $_
          }

          if (-not $installed) {
            throw "Notepad++ installation could not be verified."
          }

          Write-Output "Notepad++ installed successfully: $installed"
      register: notepad_check

    - name: Display installation result
      ansible.builtin.debug:
        var: notepad_check.output
