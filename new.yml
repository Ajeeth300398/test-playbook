---
- name: Install Notepad++ on Windows
  hosts: all
  gather_facts: false
  become: true
  become_method: runas
  become_user: Administrator

  collections:
    - ansible.windows

  vars:
    notepadplusplus_package_name: notepadplusplus
    notepadplusplus_version: ""
    notepadplusplus_install_paths:
      - C:\Program Files\Notepad++\notepad++.exe
      - C:\Program Files (x86)\Notepad++\notepad++.exe

  tasks:
    - name: Verify Windows connectivity
      ansible.windows.win_ping:

    - name: Ensure Chocolatey is installed
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $chocolateyExecutable = Join-Path $env:ProgramData 'chocolatey\bin\choco.exe'

          if (-not (Test-Path -LiteralPath $chocolateyExecutable)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Set-ExecutionPolicy Bypass -Scope Process -Force
            Invoke-Expression ((New-Object Net.WebClient).DownloadString(
              'https://community.chocolatey.org/install.ps1'
            ))
            $Ansible.Changed = $true
          }

          if (-not (Test-Path -LiteralPath $chocolateyExecutable)) {
            throw 'Chocolatey installation completed, but choco.exe is unavailable.'
          }

    - name: Install Notepad++
      ansible.windows.win_powershell:
        parameters:
          PackageName: "{{ notepadplusplus_package_name }}"
          PackageVersion: "{{ notepadplusplus_version }}"
          InstallPaths: "{{ notepadplusplus_install_paths }}"
        script: |
          param(
            [string]$PackageName,
            [string]$PackageVersion,
            [string[]]$InstallPaths
          )

          $Ansible.Changed = $false
          $isInstalled = $InstallPaths | Where-Object { Test-Path -LiteralPath $_ }
          $chocolateyExecutable = Join-Path $env:ProgramData 'chocolatey\bin\choco.exe'

          if (-not $isInstalled) {
            $arguments = @('install', $PackageName, '--yes', '--no-progress')
            if ($PackageVersion) {
              $arguments += @('--version', $PackageVersion)
            }

            & $chocolateyExecutable @arguments
            if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
              throw "Chocolatey failed to install $PackageName (exit code $LASTEXITCODE)."
            }

            $Ansible.Changed = $true
          }
      register: notepadplusplus_install

    - name: Check Notepad++ installation paths
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop: "{{ notepadplusplus_install_paths }}"
      register: notepadplusplus_paths
      changed_when: false

    - name: Confirm Notepad++ is installed
      ansible.builtin.assert:
        that:
          - notepadplusplus_paths.results | selectattr('stat.exists') | list | length > 0
        success_msg: >-
          Notepad++ is installed on {{ inventory_hostname }}.
        fail_msg: >-
          Chocolatey completed, but Notepad++ was not found in the expected paths
          on {{ inventory_hostname }}.
